name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Inspect Minecraft API (temporary)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom/26.3 -name 'minecraft-client*.jar' -not -name '*sources*' | tr '\n' ':')
          CP="$JAR"
          for J in $(echo "$JAR" | tr ':' ' '); do jar tf "$J"; done | grep -E '/(GpuBufferSlice|PrimitiveTopology|RenderPipeline|RenderPass|VertexFormat|GpuTextureView|RenderTarget|SwingAnimation|SignTextSlot|CommandEncoder|RenderPassDescriptor)\.class$' | sort -u
          for C in net.minecraft.world.item.component.SwingAnimation net.minecraft.world.level.block.entity.SignTextSlot net.minecraft.client.player.LocalPlayer; do
            echo "== javap $C"; javap -cp "$CP" -public "$C" 2>&1 | grep -Ei 'class |enum |static final|swing|DEFAULT' | head -40
          done
          echo "== SWING_ANIMATION"; javap -cp "$CP" -public net.minecraft.core.component.DataComponents 2>&1 | grep -i swing
          echo "== ItemStack swing"; javap -cp "$CP" -public net.minecraft.world.item.ItemStack 2>&1 | grep -i swing

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: star-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
