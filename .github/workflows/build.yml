name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: star-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Probe API (temporary)
        if: always()
        run: |
          JARS=$(find .gradle/loom-cache ~/.gradle/caches/modules-2 -name '*.jar' 2>/dev/null | grep -v sources | grep -Ei '26\.3|com\.mojang|lwjgl')
          CP=$(echo "$JARS" | tr '\n' ':')
          echo "===== FULL TracyFrameCapture"
          javap -cp "$CP" -c -p -constants com.mojang.blaze3d.TracyFrameCapture | grep -v '^ *[0-9]*: *\(aload\|astore\|dup\|pop\|areturn\|return\|athrow\|goto\)' || true
          echo "===== FULL Screenshot.takeScreenshot"
          javap -cp "$CP" -c -p -constants net.minecraft.client.Screenshot | sed -n '/takeScreenshot(com.mojang.blaze3d.pipeline.RenderTarget, int/,/lambda\$takeScreenshot\$0/p' || true
          echo "===== GpuTexture/GpuBuffer constants"
          javap -cp "$CP" -constants com.mojang.renderpearl.api.textures.GpuTexture com.mojang.renderpearl.api.buffers.GpuBuffer | grep 'static final' || true
