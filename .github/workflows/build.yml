name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Inspect Minecraft API (temporary)
        if: always()
        run: |
          JAR=$(find ~/.gradle/caches/fabric-loom/26.3 -name 'minecraft-client*.jar' -not -name '*sources*' | tr '\n' ':')
          for J in $(echo "$JAR" | tr ':' ' '); do jar tf "$J"; done | grep -E '(CompiledRenderPipeline|GpuDevice|CommandEncoder)\.class$' | sort -u
          for C in $(for J in $(echo "$JAR" | tr ':' ' '); do jar tf "$J"; done | grep -E '/(CompiledRenderPipeline|GpuDevice|CommandEncoder)\.class$' | sed 's#/#.#g; s#\.class$##' | sort -u) com.mojang.blaze3d.systems.RenderSystem; do
            echo "== javap $C"; javap -cp "$JAR" -public "$C" 2>&1 | grep -Ei 'Compiled|class |interface |getDevice|createRenderPass' | head -30
          done

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: star-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
