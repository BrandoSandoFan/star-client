name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build jar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: star-client
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Probe API (temporary)
        if: always()
        run: |
          JARS=$(find .gradle/loom-cache ~/.gradle/caches/modules-2 -name '*.jar' 2>/dev/null | grep -v sources | grep -Ei '26\.3|com\.mojang|renderpearl|lwjgl')
          CP=$(echo "$JARS" | tr '\n' ':')
          for j in $JARS; do unzip -Z1 "$j" 2>/dev/null | grep -q 'renderpearl/api/device/GpuDevice.class' && echo "renderpearl in $j"; done
          P() { echo "===== $1"; javap -cp "$CP" -p "$1" || true; }
          C() { echo "===== CODE $1"; javap -cp "$CP" -c -p "$1" | grep -E 'invoke|getstatic|putstatic|new |^  [a-z]|Code:' || true; }
          ALL=$(for j in $JARS; do unzip -Z1 "$j" 2>/dev/null; done | grep '\.class$' | sed 's/\.class$//; s#/#.#g' | sort -u)
          echo "$ALL" | grep -Ei 'tracy|framecapture|Screenshot|GpuBufferSlice|GpuFormat$|RenderSystem$|RenderPass$|GpuSampler$|SamplerCache|FilterMode$|GpuTextureView$|RenderPipelines$|pipeline\.RenderTarget$|TextureTarget$'
          for c in $(echo "$ALL" | grep -Ei 'GpuBufferSlice|api\.GpuFormat$|commands\.RenderPass$|SamplerCache$|pipeline\.RenderTarget$|systems\.RenderSystem$'); do P "$c"; done
          for c in $(echo "$ALL" | grep -Ei 'tracy.*capture|framecapture|client\.Screenshot$'); do P "$c"; C "$c"; done
          javap -cp "$CP" -p net.minecraft.client.renderer.RenderPipelines | grep -i 'blit\|tracy' || true
