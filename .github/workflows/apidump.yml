name: ApiDump
on:
  workflow_dispatch:
  push:
    branches: [claude/modest-cori-ydh015]
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon || true
      - name: Dump API
        run: |
          JAR=""
          for j in $(find ~/.gradle ~/work -name '*.jar' -size +5M 2>/dev/null); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/gui/GuiGraphicsExtractor.class'; then JAR="$j"; break; fi
          done
          echo "JAR=$JAR"
          for c in net.minecraft.client.gui.GuiGraphicsExtractor net.minecraft.client.gui.components.AbstractWidget net.minecraft.client.gui.components.AbstractButton net.minecraft.client.gui.components.Button net.minecraft.client.gui.components.AbstractSliderButton net.minecraft.client.gui.screens.Screen net.minecraft.client.gui.components.EditBox net.minecraft.client.gui.components.StringWidget; do
            echo "=== $c"
            javap -protected -cp "$JAR" "$c" | head -150
          done
